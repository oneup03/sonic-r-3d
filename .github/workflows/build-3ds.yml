# 3DS build — SonicR.3dsx (Homebrew Launcher) and SonicR.cia (installable).
#
# One recipe, used two ways:
#
#   - On its own, for pushes to branches other than main, pull requests and
#     manual runs. The package is attached to the run as a workflow artifact;
#     nothing is published.
#   - Called by rolling-release.yml, which builds main and publishes the same
#     sonic-r-3d-3ds.zip on the "rolling" release. main is left out of the
#     push trigger below for that reason: it would only build it twice.
#
# Like the other targets this is the engine only. No Sega game data is in the
# package; see docs/3ds.md for where the player's own copy goes.

name: 3DS build

on:
  push:
    branches-ignore: [main]
    paths:
      - "source/3ds/**"
      - "source/sdl/src/**"
      - "DATA/BIN/OPTION/NET01.RAW"
      - "DATA/SOUND/SFX/**"
      - "docs/3ds.md"
      - ".github/workflows/build-3ds.yml"
  pull_request:
    paths:
      - "source/3ds/**"
      - "source/sdl/src/**"
      - "DATA/BIN/OPTION/NET01.RAW"
      - "DATA/SOUND/SFX/**"
      - "docs/3ds.md"
      - ".github/workflows/build-3ds.yml"
  workflow_dispatch:
    inputs:
      debug-log:
        description: "Keep the debug log (stderr to svcOutputDebugString, readable over 3dslink)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      debug-log:
        type: boolean
        default: false

# A newer push to the same branch or PR supersedes the build in progress.
# Evaluated in the caller's context when rolling-release.yml calls this, where
# it only ever sees main; the caller's own group is different, so the two
# cannot wait on each other.
concurrency:
  group: build-3ds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Nintendo 3DS)
    runs-on: ubuntu-latest
    # devkitPro's own image: devkitARM, libctru, citro3d, picasso and 3dstools,
    # with DEVKITPRO/DEVKITARM already exported. devkitPro asks that CI use the
    # images rather than pacman.
    container: devkitpro/devkitarm:latest
    # Steps in a container job run under sh unless a shell is named
    # (actions/runner#1533), and sh rejects `set -o pipefail` with exit 2.
    defaults:
      run:
        shell: bash
    env:
      # push and pull_request runs have no inputs, so this falls to 0 there.
      DEBUG_LOG: ${{ inputs.debug-log && '1' || '0' }}
      # makerom and bannertool are not devkitPro packages, and their release
      # binaries need glibc 2.38 while the image is Debian 12 (2.36), so both
      # are built from pinned release tags. Everything they need (make, g++,
      # cmake, ninja) is already in the image, and it takes seconds.
      MAKEROM_SRC: https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz
      BANNERTOOL_SRC: https://github.com/carstene1ns/3ds-bannertool/archive/refs/tags/1.2.3.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Build CIA tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/ciatools/makerom /tmp/ciatools/bannertool
          cd /tmp/ciatools
          curl -fsSL "$MAKEROM_SRC" | tar -xz --strip-components=1 -C makerom
          make -C makerom/makerom -j"$(nproc)" deps >/dev/null
          make -C makerom/makerom -j"$(nproc)" >/dev/null
          install -m 755 makerom/makerom/bin/makerom /usr/local/bin/makerom
          curl -fsSL "$BANNERTOOL_SRC" | tar -xz --strip-components=1 -C bannertool
          cmake -S bannertool -B bannertool/build -G Ninja -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build bannertool/build >/dev/null
          install -m 755 bannertool/build/bannertool /usr/local/bin/bannertool
          # Neither takes a version flag; both print it in their usage banner.
          { makerom 2>&1 || true; } | head -1
          { bannertool 2>&1 || true; } | head -1

      - name: Build SonicR.3dsx
        run: make -C source/3ds -j"$(nproc)" DEBUG_LOG="$DEBUG_LOG"

      # Same objects as the .3dsx; this only adds the banner and the exheader
      # that asks for the New 3DS 804 MHz clock and L2 cache (cia/SonicR.rsf),
      # which a .3dsx can never get.
      - name: Build SonicR.cia
        run: >-
          make -C source/3ds cia DEBUG_LOG="$DEBUG_LOG"
          MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool

      - name: Package
        run: |
          set -euo pipefail
          # sonic-r-3d-3ds.zip is laid out from the SD card's root: extracting
          # it there gives /3ds/SonicR/ with SonicR.3dsx, and the few game-data
          # files the repo supplies (network icons, split replay voice clips)
          # already in their places, so the player's own data folders drop in
          # beside them. The .3dsx carries its icon, so no loose .smdh.
          out=dist/sd/3ds/SonicR
          mkdir -p "$out/BIN/OPTION" "$out/SOUND/SFX"
          cp source/3ds/SonicR.3dsx "$out/"
          cp README.md LICENSE docs/3ds.md "$out/"
          cp DATA/BIN/OPTION/NET01.RAW "$out/BIN/OPTION/"
          cp DATA/SOUND/SFX/*.WAV "$out/SOUND/SFX/"
          (cd dist/sd && zip -q -r ../../sonic-r-3d-3ds.zip 3ds)
          # The CIA ships on its own: it is installed, not copied, and reads
          # the same /3ds/SonicR/ folder.
          cp source/3ds/SonicR.cia sonic-r-3d-3ds.cia
          unzip -l sonic-r-3d-3ds.zip
          {
            echo "### Nintendo 3DS"
            echo
            echo "| File | Bytes |"
            echo "|---|---|"
            echo "| \`sonic-r-3d-3ds.zip\` (SD card, .3dsx) | $(stat -c %s sonic-r-3d-3ds.zip) |"
            echo "| \`sonic-r-3d-3ds.cia\` | $(stat -c %s sonic-r-3d-3ds.cia) |"
            echo
            echo "Debug log: \`DEBUG_LOG=$DEBUG_LOG\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact holds the release files themselves, as the Windows and
      # Linux jobs do, so the rolling release can upload whatever it downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-r-3d-3ds
          path: |
            sonic-r-3d-3ds.zip
            sonic-r-3d-3ds.cia
          retention-days: 14
